name: carchip
description: تطبيق كارشيب لتتبع المركبات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Maps
  google_maps_flutter: ^2.5.3


  # UI
  cupertino_icons: ^1.0.6
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # Utils
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0
  mobile_scanner: ^3.5.6
  permission_handler: ^11.2.0
  url_launcher: ^6.2.4

  # Icons
  flutter_svg: ^2.0.9

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
